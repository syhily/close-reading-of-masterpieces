name: Build EPUB

on:
  push:
    tags: ['v*', '[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build EPUB
        run: bash scripts/build.sh

      - name: Rename to ASCII（GitHub Release 会把非 ASCII 资产名改成 default.epub）
        run: cp build/*.epub "build/close-reading-of-masterpieces-${GITHUB_REF_NAME}.epub"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/close-reading-of-masterpieces-*.epub
          generate_release_notes: true
