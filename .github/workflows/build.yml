name: Build EPUB

on:
  push:
    tags: ['v*', '[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build EPUB
        run: bash scripts/build.sh

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.epub
          generate_release_notes: true
