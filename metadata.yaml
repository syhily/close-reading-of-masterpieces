description: |
  福建师大孙绍振教授是《语文学习》杂志的老作者，也是全国知名的文学批评家，在文学批评领域自成一家，对中学语文教材中的经典课文解读颇有独到之处。《名作细读：微观分析个案研究（第2版）》收录了孙绍振对中学语文教材经典篇目的赏读分析文章。这些分析文章深入浅出，既在文学评论领域占有领先地位，对中学语文教师的阅读教学具有实践指导意义，也对中学生阅读具有启发意义。书中应用的阅读分析方法，就像一种简单好用的工具，方便老师和学生掌握，并推广应用到更大范围的阅读实践中。
